[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivoltaic_simulation"
version = "1.0.0"
description = "Dual-Zone Tropical Agrivoltaic AI Irrigation Simulation"
requires-python = "~=3.12.0"
dependencies = [
    "numpy==2.5.1",
    "pandas==2.3.3",
    "scipy==1.16.1",
    "scikit-learn==1.9.0",
    "tensorflow==2.20.0",
    "shap==0.52.0",
    "pvlib==0.15.2",
    "matplotlib==3.10.6",
    "PyYAML==6.0.2",
    "pyarrow==21.0.0",
    "joblib==1.5.2",
    "statsmodels==0.14.5",
    "h5py==3.14.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
